# Checks db/migrations/ on every change: they apply to an empty database, roll
# back cleanly, and the committed schema.sql and test fixtures still match what
# they build. Applying them to production is the deploy's job, not this one's.
name: Database

on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - "src/test/*.json"
      - "scripts/vocab-fixture.sh"
      - "compose.yaml"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "db/**"
      - "src/test/*.json"
      - "scripts/vocab-fixture.sh"
      - "compose.yaml"
      - ".github/workflows/database.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Migrations build, roll back, and match the committed files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Apply every migration to an empty database
        run: npm run db:up

      - name: db/schema.sql is up to date
        run: git diff --exit-code db/schema.sql

      # Down then up again, so every migrate:down is known to work before it is
      # ever needed.
      - name: Roll everything back and apply it again
        run: |
          for _ in db/migrations/*.sql; do docker compose run --rm migrate --no-dump-schema rollback; done
          docker compose run --rm migrate --no-dump-schema up

      # Compared as data, not text: the committed files are formatted, the
      # script's output is not, and only the rows matter.
      - name: Test fixtures match the migrations
        run: |
          OUT="$RUNNER_TEMP" npm run db:fixtures
          for f in vocab.json demo.json; do
            python3 -c 'import json,sys; a,b=(json.load(open(p)) for p in sys.argv[1:]); sys.exit(a!=b)' \
              "src/test/$f" "$RUNNER_TEMP/$f" \
              || { echo "src/test/$f is stale: run npm run db:fixtures"; exit 1; }
          done
