# Local development: Postgres, and dbmate to apply db/migrations to it.
#
#   npm run db:up               start Postgres and apply pending migrations
#   npm run db:new -- <name>    create db/migrations/<timestamp>_<name>.sql
#   npm run db:reset            delete the local database and rebuild it
#
# There is no password: this database is for this machine only; production
# has its own credentials.
services:
  db:
    # Pinned for the schema.sql check: a 17.12 server's dump adds per-column
    # lines whose numbers change every run, so the committed file never
    # matches. Production keeps postgres:17-alpine.
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: sleepy
      # No password: Postgres is only reachable from this machine (127.0.0.1)
      # and the containers beside it, so it lets the local user straight in.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: sleepy_spinner
    ports:
      # DB_PORT= (empty) picks a free port, which is how the fixture script runs
      # beside a dev database without a clash.
      - "127.0.0.1:${DB_PORT-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleepy -d sleepy_spinner"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://sleepy@db:5432/sleepy_spinner?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./db:/db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
